name: Deploy redesign to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble lightweight site
        run: |
          set -euo pipefail
          mkdir -p _site/assets/slider _site/assets/teams/web _site/assets/portfolio

          # Pages
          cp index.html about.html team.html work.html contact.html site.css site.js _site/
          cp favicon.ico _site/ 2>/dev/null || true

          # Brand + hero + team + portfolio assets
          cp assets/HRM.png _site/assets/
          cp assets/slider/skyline-morning.jpg _site/assets/slider/
          cp assets/teams/web/*.jpg _site/assets/teams/web/
          cp assets/portfolio/rego-park-plaza.webp assets/portfolio/rego-tower.webp assets/portfolio/parsons-blvd.webp assets/portfolio/nusun-tower.webp assets/portfolio/el-ajicito.png assets/portfolio/manhattan-childrens-center.png assets/portfolio/woori-america-bank.png assets/portfolio/mosque.jpg assets/portfolio/one-penn-plaza.png assets/portfolio/mta-railcar.webp _site/assets/portfolio/

          # Keep total payload small
          du -sh _site
          find _site -type f | wc -l

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
